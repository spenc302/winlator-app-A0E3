name: Winlator Android debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: winlator-android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build ARM64 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out Winlator source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate runner Android SDK tools
        run: |
          test -d "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android native toolchains
        run: |
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "ndk;24.0.8215888" "cmake;3.22.1"

      - name: Build VC++ 2015-2022 Win Components payload
        run: |
          chmod +x .github/scripts/build-vcrun2022-component.sh
          .github/scripts/build-vcrun2022-component.sh
          test -s app/src/main/assets/wincomponents/vcrun2022.tzst

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Winlator components and runtime setup
        run: |
          grep -q "isInstalling" app/src/main/java/com/winlator/xenvironment/RootFSInstaller.java
          grep -q "wineExecutable.exists" app/src/main/java/com/winlator/xenvironment/RootFSInstaller.java
          grep -q "vcrun2022" app/src/main/assets/wincomponents/wincomponents.json
          grep -q "vcrun2022=0" app/src/main/java/com/winlator/container/Container.java
          grep -q "box64_version" app/src/main/res/values/strings.xml
          test -f .github/scripts/build-vcrun2022-component.sh
          grep -q 'name="app_name">Winlator<' app/src/main/res/values/strings.xml

      - name: Build ARM64 debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload ARM64 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: winlator-arm64-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
