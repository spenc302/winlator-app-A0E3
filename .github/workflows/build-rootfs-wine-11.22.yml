name: Build Winlator RootFS with Wine 11.22 ARM64EC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wine-rootfs:
    # x86_64 builder: Wine's helper tools run natively while the Unix side
    # is cross-compiled for AArch64 and PE modules for ARM64EC/AArch64/i386.
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      WINE_VERSION: "11.22"
      WINE_SOURCE_DIR: ${{ runner.temp }}/wine-11.22
      TOOLS_DIR: ${{ runner.temp }}/wine-tools
      BUILD_DIR: ${{ runner.temp }}/wine-arm64ec-build
      STAGE_DIR: ${{ runner.temp }}/wine-stage
      ROOTFS_DIR: ${{ runner.temp }}/rootfs

    steps:
      - name: Checkout Winlator app source
        uses: actions/checkout@v4
        with:
          ref: generic-winlator-port

      - name: Install cross-build dependencies
        run: |
          set -euxo pipefail
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu pkg-config flex bison perl python3 \
            git curl ca-certificates xz-utils zstd rsync file patchelf \
            libfreetype-dev libfontconfig1-dev \
            libfreetype-dev:arm64 libfontconfig1-dev:arm64 \
            libgnutls28-dev:arm64 libx11-dev:arm64 libxext-dev:arm64 \
            libxrender-dev:arm64 libxrandr-dev:arm64 libxi-dev:arm64 \
            libxfixes-dev:arm64 libxcursor-dev:arm64 libxinerama-dev:arm64 \
            libxcomposite-dev:arm64 libxdamage-dev:arm64 \
            libgstreamer1.0-dev:arm64 libgstreamer-plugins-base1.0-dev:arm64 \
            libvulkan-dev:arm64 libgl-dev:arm64 \
            libpulse-dev:arm64 libasound2-dev:arm64

      - name: Install LLVM-MinGW ARM64EC cross compiler
        run: |
          set -euo pipefail
          TOOLCHAIN_URL="https://github.com/mstorsjo/llvm-mingw/releases/download/20261104/llvm-mingw-20261104-msvcrt-ubuntu-22.04-x86_64.tar.xz"
          curl --fail --location --retry 3 "$TOOLCHAIN_URL" -o "$RUNNER_TEMP/llvm-mingw.tar.xz"
          mkdir -p "$RUNNER_TEMP/llvm-mingw"
          tar -xf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
          echo "$RUNNER_TEMP/llvm-mingw/bin" >> "$GITHUB_PATH"
          test -x "$RUNNER_TEMP/llvm-mingw/bin/arm64ec-w64-mingw32-clang"
          "$RUNNER_TEMP/llvm-mingw/bin/arm64ec-w64-mingw32-clang" --version
          "$RUNNER_TEMP/llvm-mingw/bin/aarch64-w64-mingw32-clang" --version

      - name: Extract the current Winlator RootFS
        run: |
          set -euo pipefail
          test -s app/src/main/assets/rootfs.tzst
          mkdir -p "$ROOTFS_DIR"
          tar --zstd -xf app/src/main/assets/rootfs.tzst -C "$ROOTFS_DIR"
          test -d "$ROOTFS_DIR/usr"
          test -x "$ROOTFS_DIR/opt/wine/bin/wine"
          test -e "$ROOTFS_DIR/lib/ld-linux-aarch64.so.1" -o -e "$ROOTFS_DIR/usr/lib/ld-linux-aarch64.so.1"

      - name: Download Wine 11.22 source
        run: |
          set -euo pipefail
          mkdir -p "$WINE_SOURCE_DIR"
          curl --fail --location --retry 3 \
            "https://dl.winehq.org/wine/source/11.x/wine-11.22.tar.xz" \
            -o "$RUNNER_TEMP/wine-11.22.tar.xz"
          tar -xf "$RUNNER_TEMP/wine-11.22.tar.xz" -C "$WINE_SOURCE_DIR"
          test -f "$WINE_SOURCE_DIR/wine-11.22/configure"

      - name: Build native Wine helper tools
        run: |
          set -euo pipefail
          mkdir -p "$TOOLS_DIR"
          cd "$TOOLS_DIR"
          "$WINE_SOURCE_DIR/wine-11.22/configure" \
            --enable-win64 \
            --without-x \
            --without-gstreamer \
            --without-vulkan \
            --without-opengl \
            --without-unwind \
            --disable-tests
          make __tooldeps__ -j"$(nproc)"
          make -C nls -j"$(nproc)"

      - name: Configure Wine ARM64EC and AArch64 Unix build
        run: |
          set -euo pipefail
          mkdir -p "$BUILD_DIR" "$STAGE_DIR"
          cd "$BUILD_DIR"
          export PATH="$RUNNER_TEMP/llvm-mingw/bin:$PATH"
          export PKG_CONFIG_LIBDIR="/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig"
          unset PKG_CONFIG_PATH PKG_CONFIG_SYSROOT_DIR CROSSCC
          env \
            CC=aarch64-linux-gnu-gcc \
            CFLAGS="-O2 -pipe -Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types" \
            CROSSCFLAGS="-O2 -pipe" \
            LDFLAGS="-Wl,--dynamic-linker=/lib/ld-linux-aarch64.so.1 -Wl,-rpath=/usr/lib -Wl,--sort-common,--as-needed" \
            "$WINE_SOURCE_DIR/wine-11.22/configure" \
            --prefix=/opt/wine \
            --host=aarch64-linux-gnu \
            --enable-archs=arm64ec,aarch64,i386 \
            --with-mingw=clang \
            --with-wine-tools="$TOOLS_DIR" \
            --with-freetype \
            --with-fontconfig \
            --with-gstreamer \
            --with-vulkan \
            --with-opengl \
            --with-gnutls \
            --with-xrandr \
            --with-xrender \
            --with-pulse \
            --with-alsa \
            --enable-tools \
            --disable-tests \
            --disable-win16 \
            --without-unwind \
            --without-dbus \
            --without-inotify \
            --without-netapi \
            --without-xinerama \
            --without-capi \
            --without-coreaudio \
            --without-cups \
            --without-gphoto \
            --without-oss \
            --without-pcap \
            --without-pcsclite \
            --without-sane \
            --without-udev \
            --without-usb \
            --without-v4l2 \
            --without-wayland \
            --without-ffmpeg \
            --without-opencl \
            --without-sdl \
            --without-krb5 \
            --without-gssapi \
            --without-gettext \
            --with-gettextpo=no

      - name: Compile and install Wine 11.22
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"
          make -j"$(nproc)"
          make DESTDIR="$STAGE_DIR" install STRIP=true
          WINE_ROOT="$STAGE_DIR/opt/wine"
          test -x "$WINE_ROOT/bin/wine"
          test -f "$WINE_ROOT/lib/wine/aarch64-windows/ntdll.dll"
          test -f "$WINE_ROOT/lib/wine/arm64ec-windows/ntdll.dll"
          test -f "$WINE_ROOT/lib/wine/i386-windows/ntdll.dll"
          test -f "$WINE_ROOT/lib/wine/aarch64-unix/ntdll.so"
          file "$WINE_ROOT/bin/wine"
          file "$WINE_ROOT/lib/wine/aarch64-unix/ntdll.so"
          file "$WINE_ROOT/lib/wine/arm64ec-windows/ntdll.dll"
          printf '%s\n' "Wine source version: $WINE_VERSION" > "$STAGE_DIR/WINE-BUILD-INFO.txt"

      - name: Merge Wine into existing RootFS and package
        run: |
          set -euo pipefail
          WINE_ROOT="$STAGE_DIR/opt/wine"
          rm -rf "$ROOTFS_DIR/opt/wine"
          mkdir -p "$ROOTFS_DIR/opt/wine"
          rsync -a "$WINE_ROOT/" "$ROOTFS_DIR/opt/wine/"
          test -x "$ROOTFS_DIR/opt/wine/bin/wine"
          test -f "$ROOTFS_DIR/opt/wine/lib/wine/arm64ec-windows/ntdll.dll"
          mkdir -p dist
          tar -I 'zstd -T0 -19' -cf dist/rootfs-wine-11.22.tzst -C "$ROOTFS_DIR" .
          test -s dist/rootfs-wine-11.22.tzst
          sha256sum dist/rootfs-wine-11.22.tzst > dist/SHA256SUMS.txt
          printf '%s\n' "Built from Wine $WINE_VERSION source" > dist/BUILD-INFO.txt

      - name: Upload RootFS artifact for review
        uses: actions/upload-artifact@v4
        with:
          name: winlator-rootfs-wine-11.22-arm64ec
          path: |
            dist/rootfs-wine-11.22.tzst
            dist/SHA256SUMS.txt
            dist/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 14
