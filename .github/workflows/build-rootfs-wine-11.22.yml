name: Build Winlator RootFS with Wine 11.22

on:
  workflow_dispatch:
    inputs:
      wine_arm64ec_url:
        description: "Direct URL to a Wine 11.22 ARM64EC Winlator archive (.wcp or tar archive)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-rootfs:
    # ARM64 runner is required to execute and validate the ARM64 Linux Wine host binary.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Checkout Winlator app source
        uses: actions/checkout@v4
        with:
          ref: generic-winlator-port

      - name: Install archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd rsync file

      - name: Extract current RootFS
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/assets/rootfs.tzst
          mkdir -p "$RUNNER_TEMP/rootfs"
          tar --zstd -xf app/src/main/assets/rootfs.tzst -C "$RUNNER_TEMP/rootfs"
          test -d "$RUNNER_TEMP/rootfs/usr"
          test -x "$RUNNER_TEMP/rootfs/opt/wine/bin/wine"

      - name: Download and validate Wine 11.22 ARM64EC archive
        env:
          WINE_ARCHIVE_URL: ${{ inputs.wine_arm64ec_url }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wine-package" "$RUNNER_TEMP/wine-stage"
          curl --fail --location --retry 3 --retry-all-errors "$WINE_ARCHIVE_URL" \
            --output "$RUNNER_TEMP/wine-package/wine-11.22-arm64ec.archive"

          # Winlator WCP packages are tar archives. Reject unsupported archive formats.
          tar -tf "$RUNNER_TEMP/wine-package/wine-11.22-arm64ec.archive" >/dev/null
          tar -xf "$RUNNER_TEMP/wine-package/wine-11.22-arm64ec.archive" \
            -C "$RUNNER_TEMP/wine-stage"

          WINE_BIN="$(find "$RUNNER_TEMP/wine-stage" -type f -path '*/bin/wine' -print -quit)"
          test -n "$WINE_BIN"
          WINE_ROOT="${WINE_BIN%/bin/wine}"
          file "$WINE_BIN" | tee "$RUNNER_TEMP/wine-binary.txt"
          grep -E 'ARM aarch64|AArch64' "$RUNNER_TEMP/wine-binary.txt"

          echo "WINE_ROOT=$WINE_ROOT" >> "$GITHUB_ENV"

      - name: Replace only /opt/wine and verify version
        shell: bash
        run: |
          set -euo pipefail
          ROOTFS="$RUNNER_TEMP/rootfs"
          test -d "$WINE_ROOT/bin"
          test -x "$WINE_ROOT/bin/wine"

          # Keep the existing RootFS, libraries, patches, and all non-Wine files.
          find "$ROOTFS/opt/wine" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          rsync -a "$WINE_ROOT/" "$ROOTFS/opt/wine/"

          test -x "$ROOTFS/opt/wine/bin/wine"
          WINE_VERSION="$(chroot "$ROOTFS" /opt/wine/bin/wine --version)"
          echo "Detected runtime: $WINE_VERSION"
          [[ "$WINE_VERSION" == *"11.22"* ]]

      - name: Package and validate compatible rootfs.tzst
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          tar --zstd -I 'zstd -T0 -19' -cf dist/rootfs-wine-11.22.tzst \
            -C "$RUNNER_TEMP/rootfs" .
          test -s dist/rootfs-wine-11.22.tzst

          mkdir -p "$RUNNER_TEMP/verify"
          tar --zstd -xf dist/rootfs-wine-11.22.tzst -C "$RUNNER_TEMP/verify"
          test -d "$RUNNER_TEMP/verify/usr"
          test -x "$RUNNER_TEMP/verify/opt/wine/bin/wine"
          VERIFIED_VERSION="$(chroot "$RUNNER_TEMP/verify" /opt/wine/bin/wine --version)"
          [[ "$VERIFIED_VERSION" == *"11.22"* ]]
          sha256sum dist/rootfs-wine-11.22.tzst | tee dist/SHA256SUMS.txt

      - name: Upload compatible RootFS artifact
        uses: actions/upload-artifact@v4
        with:
          name: winlator-rootfs-wine-11.22
          path: |
            dist/rootfs-wine-11.22.tzst
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
