name: A0E3 Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/octo86-android-debug.yml

permissions:
  contents: read

concurrency:
  group: a0e3-android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build ARM64 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out A0E3 source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use runner Android SDK
        run: |
          test -d "$ANDROID_HOME"
          echo "$ANDROID_HOME/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android native toolchains
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --install "ndk;24.0.8215888" "cmake;3.22.1"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify A0E3 integration
        run: |
          test -f app/src/main/java/com/winlator/Aoe3HomeFragment.java
          test -f app/src/main/java/com/winlator/GameImportManager.java
          grep -q "Aoe3HomeFragment" app/src/main/java/com/winlator/MainActivity.java
          grep -q 'name="app_name">A0E3<' app/src/main/res/values/strings.xml

      - name: Build ARM64 debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload ARM64 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: a0e3-arm64-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
