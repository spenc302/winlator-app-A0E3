name: Octo86 Android debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: octo86-android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build ARM64 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out Octo86 Winlator source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android native toolchains
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "ndk;24.0.8215888" "cmake;3.22.1"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Octo86 UI integration
        run: |
          test -f app/src/main/java/com/winlator/Aoe3HomeFragment.java
          grep -q "Aoe3HomeFragment" app/src/main/java/com/winlator/MainActivity.java
          grep -q "Octo86" app/src/main/res/values/strings.xml

      - name: Build ARM64 debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload ARM64 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: octo86-arm64-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
